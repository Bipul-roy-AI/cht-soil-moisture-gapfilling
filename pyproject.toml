[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cht-soil-moisture-research"
version = "0.2.0"
description = "Auditable target-cell soil-moisture reconstruction research"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "pandas>=2.1,<3", "scipy>=1.11,<2", "scikit-learn>=1.5,<2", "matplotlib>=3.8,<4", "joblib>=1.3,<2"]

[project.optional-dependencies]
gee = ["earthengine-api>=1.5,<2"]
train = ["xgboost>=2.1,<4"]
notebooks = ["nbformat>=5.10,<6", "nbclient>=0.10,<1", "ipykernel>=6,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"chtsm.vendor" = ["LICENSE_gee_s1_ard.txt"]
